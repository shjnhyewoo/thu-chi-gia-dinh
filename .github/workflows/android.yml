name: Build APK Android

on:
  push:
    branches: [main]
    paths: ['index.html', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Chép app web vào APK
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html

      - name: Chuẩn bị khóa ký
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Chưa có secret KEYSTORE_B64, APK sẽ dùng khóa debug tạm thời"
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Đổi tên file
        run: cp android/app/build/outputs/apk/release/app-release.apk ThuChiGiaDinh.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ThuChiGiaDinh-apk
          path: ThuChiGiaDinh.apk

      - name: Đăng lên trang Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" ThuChiGiaDinh.apk \
            --title "Thu Chi Gia Đình $TAG" \
            --notes "Tải file **ThuChiGiaDinh.apk** bên dưới về điện thoại Android rồi mở để cài đặt." \
            --latest
